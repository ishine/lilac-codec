<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="980" viewBox="0 0 1920 980">
<title>LILAC architecture: mirrored encoder/decoder with the staged discard schedule, shared weights, context-driven predictor fill, and the exact re-encode loop</title>

<defs>
  <style>
    text { font-family: "Noto Sans", "DejaVu Sans", sans-serif; fill: #1f2937; }
    .name { font-size: 30px; text-anchor: middle; }
    .ann  { font-size: 26px; fill: #6b7280; }
    .band { font-size: 26px; fill: #9ca3af; letter-spacing: 3px; }
    .hero { font-size: 28px; font-weight: bold; fill: #b3352b; }
    .enc  { fill: #e9f1fb; stroke: #3d6db5; stroke-width: 1.6; }
    .dec  { fill: #ffffff; stroke: #3d6db5; stroke-width: 1.6; }
    .code { fill: #efeafa; stroke: #6d4fc4; stroke-width: 1.6; }
    .pred { fill: #fdf3e2; stroke: #c98a2b; stroke-width: 1.6; }
    .flow { fill: none; stroke: #6b7280; stroke-width: 2; }
    .wave { fill: none; stroke: #1f2937; stroke-width: 2.6; stroke-linecap: round; }
  </style>
  <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
    <path d="M0,0 L8,4 L0,8 Z" fill="#6b7280"/>
  </marker>
  <marker id="aAmber" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
    <path d="M0,0 L8,4 L0,8 Z" fill="#c98a2b"/>
  </marker>
  <marker id="aRed" markerWidth="10" markerHeight="10" refX="7.5" refY="4.5" orient="auto" markerUnits="userSpaceOnUse">
    <path d="M0,0 L9,4.5 L0,9 Z" fill="#b3352b"/>
  </marker>
  <!-- smooth audio squiggle, 110 wide, centered on y=0 -->
  <path id="squiggle" d="M0 0 C6 -26, 12 -26, 18 0 S30 30, 36 0 S48 -16, 54 0 S66 22, 72 0 S84 -28, 90 0 S102 12, 110 0"/>
  <!-- shared-weights coupler (dash gap around split keep-labels) -->
  <g id="coupler">
    <line x1="0" y1="225" x2="0" y2="436" stroke="#c3cbd4" stroke-width="1.4" stroke-dasharray="1 6" stroke-linecap="round"/>
    <circle cx="0" cy="366" r="16" fill="#fff" stroke="#9aa6b2" stroke-width="1.3"/>
    <text x="0" y="375" font-size="26px" fill="#6b7280" text-anchor="middle">=</text>
  </g>
  <g id="couplerSplit">
    <line x1="0" y1="296" x2="0" y2="436" stroke="#c3cbd4" stroke-width="1.4" stroke-dasharray="1 6" stroke-linecap="round"/>
    <circle cx="0" cy="366" r="16" fill="#fff" stroke="#9aa6b2" stroke-width="1.3"/>
    <text x="0" y="375" font-size="26px" fill="#6b7280" text-anchor="middle">=</text>
  </g>
  <!-- one projection split: capsule + discard arrow above + keep/rate below -->
  <g id="split">
    <line x1="0" y1="138" x2="0" y2="104" class="flow" stroke-dasharray="7 6" marker-end="url(#a)"/>
    <rect x="-55" y="141" width="110" height="78" rx="39" class="enc"/>
    <text x="0" y="190" class="name">Split</text>
  </g>
  <g id="merge">
    <rect x="-55" y="441" width="110" height="78" rx="39" class="dec"/>
    <text x="0" y="490" class="name">Merge</text>
  </g>
  <!-- context upsample pill on the rail -->
  <g id="up2">
    <rect x="-30" y="-17" width="60" height="34" rx="17" class="pred"/>
    <text x="0" y="9" font-size="26px" fill="#1f2937" text-anchor="middle">&#215;2</text>
  </g>
</defs>

<rect x="0" y="0" width="1920" height="980" fill="#fff"/>

<!-- ============ band labels ============ -->
<text x="205" y="62" class="band">ENCODER</text>
<text x="205" y="422" class="band">DECODER</text>
<text x="205" y="674" class="band">PREDICTOR</text>

<!-- ============ discard micro-legend ============ -->
<text x="1075" y="46" class="ann" text-anchor="middle">discarded coordinates are never transmitted &#8212; the decoder re-predicts them</text>

<!-- ============ encoder row (cy 180) ============ -->
<g id="encoder">
  <use href="#squiggle" x="50" y="180" class="wave"/>
  <text x="105" y="122" class="ann" text-anchor="middle">[1, T] &#183; 24 kHz</text>

  <rect x="205" y="141" width="150" height="78" rx="39" class="enc"/>
  <text x="280" y="190" class="name">Stem</text>

  <rect x="420" y="141" width="210" height="78" rx="39" class="enc"/>
  <text x="525" y="190" class="name">Growth &#215;4</text>

  <line x1="168" y1="180" x2="200" y2="180" class="flow" marker-end="url(#a)"/>
  <line x1="357" y1="180" x2="415" y2="180" class="flow" marker-end="url(#a)"/>
  <line x1="632" y1="180" x2="686" y2="180" class="flow" marker-end="url(#a)"/>
  <text x="387" y="128" class="ann" text-anchor="middle">[5, T/5]</text>
  <text x="660" y="128" class="ann" text-anchor="middle">[80, T/80]</text>

  <!-- the projection-split ladder: per-stage discard + keep/rate -->
  <use href="#split" x="745" y="0"/>
  <use href="#split" x="910" y="0"/>
  <use href="#split" x="1075" y="0"/>
  <use href="#split" x="1240" y="0"/>
  <use href="#split" x="1405" y="0"/>

  <text x="745" y="90" class="ann" text-anchor="middle">discard 80</text>
  <text x="910" y="90" class="ann" text-anchor="middle">discard 80</text>
  <text x="1075" y="90" class="ann" text-anchor="middle">discard 80</text>
  <text x="1240" y="90" class="ann" text-anchor="middle">discard 80</text>
  <text x="1405" y="90" class="ann" text-anchor="middle">discard 140</text>

  <text x="745" y="253" class="ann" text-anchor="middle">keep 80</text>
  <text x="745" y="285" class="ann" text-anchor="middle">T/160</text>
  <text x="910" y="253" class="ann" text-anchor="middle">keep 80</text>
  <text x="910" y="285" class="ann" text-anchor="middle">T/320</text>
  <text x="1075" y="253" class="ann" text-anchor="middle">keep 80</text>
  <text x="1075" y="285" class="ann" text-anchor="middle">T/640</text>
  <text x="1240" y="253" class="ann" text-anchor="middle">keep 80</text>
  <text x="1240" y="285" class="ann" text-anchor="middle">T/1280</text>
  <text x="1405" y="253" class="ann" text-anchor="middle">keep 20</text>
  <text x="1405" y="285" class="ann" text-anchor="middle">T/2560</text>

  <line x1="802" y1="180" x2="850" y2="180" class="flow" marker-end="url(#a)"/>
  <line x1="967" y1="180" x2="1015" y2="180" class="flow" marker-end="url(#a)"/>
  <line x1="1132" y1="180" x2="1180" y2="180" class="flow" marker-end="url(#a)"/>
  <line x1="1297" y1="180" x2="1345" y2="180" class="flow" marker-end="url(#a)"/>
  <line x1="1462" y1="180" x2="1495" y2="180" class="flow" marker-end="url(#a)"/>

  <rect x="1500" y="141" width="130" height="78" rx="39" class="code"/>
  <text x="1565" y="190" class="name">FSQ</text>
</g>

<!-- ============ the code z (between the rows) ============ -->
<g id="code-z">
  <line x1="1565" y1="221" x2="1565" y2="273" class="flow" marker-end="url(#a)"/>
  <rect x="1510" y="280" width="110" height="60" rx="30" class="code"/>
  <text x="1565" y="321" class="name" font-weight="bold" fill="#4c3595">z</text>
  <text x="1640" y="302" class="ann">[20, T/2560]</text>
  <text x="1640" y="334" class="ann">9.375 Hz</text>

  <path d="M1565 340 V480" class="flow"/>
  <circle cx="1565" cy="480" r="4" fill="#6b7280"/>
  <path d="M1565 480 H1467" class="flow" marker-end="url(#a)"/>
  <path d="M1565 480 V600" class="flow" marker-end="url(#a)"/>
</g>

<!-- ============ shared-weight couplers ============ -->
<use href="#coupler" x="280" y="0"/>
<use href="#coupler" x="525" y="0"/>
<use href="#couplerSplit" x="745" y="0"/>
<use href="#couplerSplit" x="910" y="0"/>
<use href="#couplerSplit" x="1075" y="0"/>
<use href="#couplerSplit" x="1240" y="0"/>
<use href="#couplerSplit" x="1405" y="0"/>
<text x="635" y="412" class="ann" text-anchor="middle">shared weights</text>

<!-- ============ decoder row (cy 480), right to left ============ -->
<g id="decoder">
  <use href="#merge" x="1405" y="0"/>
  <use href="#merge" x="1240" y="0"/>
  <use href="#merge" x="1075" y="0"/>
  <use href="#merge" x="910" y="0"/>
  <use href="#merge" x="745" y="0"/>

  <line x1="1348" y1="480" x2="1300" y2="480" class="flow" marker-end="url(#a)"/>
  <line x1="1183" y1="480" x2="1135" y2="480" class="flow" marker-end="url(#a)"/>
  <line x1="1018" y1="480" x2="970" y2="480" class="flow" marker-end="url(#a)"/>
  <line x1="853" y1="480" x2="805" y2="480" class="flow" marker-end="url(#a)"/>
  <line x1="688" y1="480" x2="635" y2="480" class="flow" marker-end="url(#a)"/>

  <rect x="420" y="441" width="210" height="78" rx="39" class="dec"/>
  <text x="525" y="490" class="name">Growth&#8315;&#185; &#215;4</text>

  <rect x="205" y="441" width="150" height="78" rx="39" class="dec"/>
  <text x="280" y="490" class="name">Stem&#8315;&#185;</text>

  <line x1="418" y1="480" x2="360" y2="480" class="flow" marker-end="url(#a)"/>
  <line x1="203" y1="480" x2="170" y2="480" class="flow" marker-end="url(#a)"/>

  <use href="#squiggle" x="50" y="480" class="wave"/>
  <text x="105" y="552" class="ann" text-anchor="middle">[1, T] &#183; full band</text>
</g>

<!-- ============ re-encode loop (the claim) ============ -->
<g id="loop">
  <path d="M46 506 Q10 506 10 464 V196 Q10 154 46 154" fill="none" stroke="#b3352b"
        stroke-width="2.6" stroke-dasharray="9 7" marker-end="url(#aRed)"/>
  <text x="30" y="312" class="hero">enc(dec(z)) = z</text>
  <text x="30" y="346" class="ann" fill="#b3352b">bit-exact, any fill</text>
</g>

<!-- ============ predictor tier (cy 655) ============ -->
<g id="predictor">
  <rect x="620" y="607" width="810" height="96" rx="48" class="pred"/>
  <text x="1025" y="651" class="name">Predictor &#215;5</text>
  <text x="1025" y="687" class="ann" text-anchor="middle">predicts the discarded block from context + partial recon</text>

  <rect x="1465" y="607" width="390" height="96" rx="48" class="pred"/>
  <text x="1660" y="651" class="name">CodeContext</text>
  <text x="1660" y="687" class="ann" text-anchor="middle">conv tower on z, run once</text>

  <!-- per-stage fill into each Merge -->
  <line x1="745" y1="605" x2="745" y2="524" stroke="#c98a2b" stroke-width="2.4" marker-end="url(#aAmber)"/>
  <line x1="910" y1="605" x2="910" y2="524" stroke="#c98a2b" stroke-width="2.4" marker-end="url(#aAmber)"/>
  <line x1="1075" y1="605" x2="1075" y2="524" stroke="#c98a2b" stroke-width="2.4" marker-end="url(#aAmber)"/>
  <line x1="1240" y1="605" x2="1240" y2="524" stroke="#c98a2b" stroke-width="2.4" marker-end="url(#aAmber)"/>
  <line x1="1405" y1="605" x2="1405" y2="524" stroke="#c98a2b" stroke-width="2.4" marker-end="url(#aAmber)"/>
  <text x="757" y="576" class="ann" fill="#c98a2b">fill 80</text>
  <text x="922" y="576" class="ann" fill="#c98a2b">fill 80</text>
  <text x="1087" y="576" class="ann" fill="#c98a2b">fill 80</text>
  <text x="1252" y="576" class="ann" fill="#c98a2b">fill 80</text>
  <text x="1417" y="576" class="ann" fill="#c98a2b">fill 140</text>

  <!-- context rail: z-rate context, upsampled x2 per stage, tapped by every stage -->
  <path d="M1660 703 V775 H745" class="flow"/>
  <line x1="745" y1="775" x2="745" y2="710" class="flow" marker-end="url(#a)"/>
  <line x1="910" y1="775" x2="910" y2="710" class="flow" marker-end="url(#a)"/>
  <line x1="1075" y1="775" x2="1075" y2="710" class="flow" marker-end="url(#a)"/>
  <line x1="1240" y1="775" x2="1240" y2="710" class="flow" marker-end="url(#a)"/>
  <line x1="1405" y1="775" x2="1405" y2="710" class="flow" marker-end="url(#a)"/>
  <use href="#up2" x="828" y="775"/>
  <use href="#up2" x="993" y="775"/>
  <use href="#up2" x="1158" y="775"/>
  <use href="#up2" x="1323" y="775"/>
  <text x="1075" y="826" class="ann" text-anchor="middle">context upsampled &#215;2 per stage &#8212; every scale is conditioned on z</text>
</g>

<!-- ============ rate family footer ============ -->
<g id="rate-family">
  <line x1="205" y1="866" x2="1815" y2="866" stroke="#e2e6ea" stroke-width="1.4"/>
  <text x="1010" y="924" font-size="26px" text-anchor="middle" fill="#1f2937">flagship  C = 20,  d = 7:   0.75 kb/s  at  9.375 Hz</text>
</g>
</svg>
